<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Management Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background-color: #f4f4f4;
    }
    .page-card {
      margin-top: 40px;
    }
    .table thead th {
      background-color: #f8f9fa;
    }
    small.error-msg {
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container page-card">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">User List</h3>
        </div>

        <table class="table mb-3">
          <thead>
            <tr>
              <th>Username</th>
              <th>Fullname</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <!-- New users will be appended here -->
          </tbody>
        </table>

        <button
          class="btn btn-primary"
          id="btnAddUser"
          data-bs-toggle="modal"
          data-bs-target="#userModal"
        >
          Add New User
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: Add New User -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="userForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title">Add New User</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <!-- Username -->
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" />
              <small class="text-danger error-msg d-none">
                This field must not be empty
              </small>
            </div>

            <!-- Fullname -->
            <div class="mb-3">
              <label for="fullname" class="form-label">Fullname</label>
              <input type="text" class="form-control" id="fullname" />
              <small class="text-danger error-msg d-none">
                This field must not be empty
              </small>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" />
              <small class="text-danger error-msg d-none">
                This field must not be empty
              </small>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Add User</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    $(function () {
      const userModal = new bootstrap.Modal(document.getElementById("userModal"));

      function showError($input) {
        $input.addClass("is-invalid").css("border-color", "red");
        $input.next(".error-msg").removeClass("d-none");
      }

      function clearError($input) {
        $input.removeClass("is-invalid").css("border-color", "");
        $input.next(".error-msg").addClass("d-none");
      }

      // Clear errors when user types
      $("#userForm input").on("input", function () {
        if ($(this).val().trim() !== "") {
          clearError($(this));
        }
      });

      // Reset form every time modal opens
      $("#btnAddUser").on("click", function () {
        $("#userForm")[0].reset();
        $("#userForm input").each(function () {
          clearError($(this));
        });
      });

      // Handle form submit
      $("#userForm").on("submit", function (e) {
        e.preventDefault();

        let valid = true;
        const $username = $("#username");
        const $fullname = $("#fullname");
        const $email = $("#email");

        // simple required check
        [$username, $fullname, $email].forEach(function ($field) {
          if ($field.val().trim() === "") {
            showError($field);
            valid = false;
          } else {
            clearError($field);
          }
        });

        if (!valid) return;

        // If all valid, add new row to table
        const row =
          "<tr>" +
          "<td>" + $("<div>").text($username.val().trim()).html() + "</td>" +
          "<td>" + $("<div>").text($fullname.val().trim()).html() + "</td>" +
          "<td>" + $("<div>").text($email.val().trim()).html() + "</td>" +
          "</tr>";

        $("#userTableBody").append(row);

        // Close modal
        userModal.hide();
      });
    });
  </script>
</body>
</html>
